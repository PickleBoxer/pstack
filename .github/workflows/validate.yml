name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      # plugin test runs every *.test.ts under the folder, and upstream's bun tests under skills/ cannot load there
      - run: |
          mkdir "$RUNNER_TEMP/mod"
          cp -R .claude-plugin hooks tests tsconfig.json "$RUNNER_TEMP/mod/"
          npx -y @anthropic-ai/claude-code plugin test "$RUNNER_TEMP/mod"
